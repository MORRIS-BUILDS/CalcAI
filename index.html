<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalcAI Next</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

</head>

<body>

<div class="app">

<input id="display" placeholder="Type / Speak / AI..." />

<div class="top-buttons">
<button onclick="startVoice()">🎤</button>
<button onclick="askAI()">🤖 AI</button>
</div>

<div class="buttons">
<button onclick="clearDisplay()">C</button>
<button onclick="append('(')">(</button>
<button onclick="append(')')">)</button>
<button onclick="append('/')">÷</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('*')">×</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="append('-')">−</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="append('+')">+</button>

<button onclick="append('0')" class="zero">0</button>
<button onclick="append('.')">.</button>
<button onclick="calculate()">=</button>
</div>

<div class="scientific">
<button onclick="append('sin(')">sin</button>
<button onclick="append('cos(')">cos</button>
<button onclick="append('tan(')">tan</button>
<button onclick="append('sqrt(')">√</button>
<button onclick="append('log10(')">log</button>
<button onclick="append('^')">xʸ</button>
<button onclick="append('pi')">π</button>
<button onclick="append('e')">e</button>
<button onclick="plotGraph()">📊</button>
</div>

<div id="history"></div>
<div id="graph"></div>

</div>

<script src="script.js"></script>

</body>
</html>
